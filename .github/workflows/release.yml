# Publishes to PyPI on a "v*" tag push, using PyPI Trusted Publishing (OIDC) -
# no API token stored in this repo. Before the first tag is pushed, the PyPI
# project (https://pypi.org/manage/project/mquery-toolkit/settings/publishing/)
# must have a trusted publisher configured for this exact repository, workflow
# file name ("release.yml"), and the "pypi" environment used below.

name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"

      - name: Verify tag matches project version
        env:
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: |
          python - <<'EOF'
          import os
          import sys
          import tomllib

          with open("pyproject.toml", "rb") as handle:
              version = tomllib.load(handle)["project"]["version"]
          expected = f"v{version}"
          actual = os.environ["GITHUB_REF_NAME"]
          if actual != expected:
              sys.exit(
                  f"tag {actual!r} does not match pyproject.toml version {expected!r}"
              )
          EOF

      # A tag must not publish code that has not passed the same checks CI runs.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: 22
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm run bundle
      - run: git diff --exit-code -- src/mquery_toolkit/_bridge.cjs
      - run: python -m pip install -e ".[dev,fabric]"
      - run: python -m pytest -q --cov=mquery_toolkit --cov-fail-under=80
      - run: python -m mypy src
      - run: python -m ruff check .
      - run: python -m ruff format --check .
      - run: python -m pip_audit
      - run: python -m pip install semgrep==1.157.0 && semgrep scan --metrics=off --disable-version-check --error --config semgrep-rules.yaml src tests js

      - run: pip install build twine
      - run: python -m build
      - run: twine check dist/*

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33  # v1.14.2

  # Uncomment to dry-run a release against TestPyPI before the real PyPI
  # trusted publisher is configured. TestPyPI needs its own trusted publisher
  # entry (same repo/workflow, "testpypi" environment) pointed at
  # https://test.pypi.org/legacy/.
