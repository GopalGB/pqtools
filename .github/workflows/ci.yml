name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: 22

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: ${{ matrix.python-version }}

      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm run bundle
      - run: git diff --exit-code -- src/mquery_toolkit/_bridge.cjs

      - run: python -m pip install -e ".[dev,fabric]"
      - run: python -m pytest -q --cov=mquery_toolkit --cov-fail-under=80
      - run: python -m mypy src
      - run: python -m ruff check .
      - run: python -m ruff format --check .
      - run: python -m build
      - run: python -m twine check dist/*
      - run: python -m pip_audit
      - run: python -m pip install semgrep && semgrep scan --metrics=off --disable-version-check --error --config semgrep-rules.yaml src tests js
        if: runner.os == 'Linux'
