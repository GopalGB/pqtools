name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: 22

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: ${{ matrix.python-version }}

      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm run bundle
      - run: git diff --exit-code -- src/pqtools/_bridge.cjs

      - run: python -m pip install -e ".[dev,fabric]"
      - run: python -m pytest -q --cov=pqtools --cov-fail-under=80
      - run: python -m mypy src
      - run: python -m ruff check .
      - run: python -m ruff format --check .
      - run: python -m build
      - run: python -m twine check dist/*
      # pip_audit audits the whole environment, so GitHub's preinstalled pip/setuptools
      # can fail a build over advisories that are not ours and that we do not ship.
      # Upgrade them so the audit stays strict rather than suppressing IDs.
      - run: python -m pip install --upgrade pip setuptools
      - run: python -m pip_audit
      - run: python -m pip install semgrep==1.157.0 && semgrep scan --metrics=off --disable-version-check --error --config semgrep-rules.yaml src tests js
        if: runner.os == 'Linux'

      - name: Floor run without optional extras (Linux)
        if: runner.os == 'Linux'
        run: |
          PYTHON_BIN="$(command -v python)"
          python -m venv /tmp/pqtools-floor-venv
          /tmp/pqtools-floor-venv/bin/python -m pip install -e .
          FLOOR_LOG="$(git ls-files 'evidence/floor-venv-suite-*.log' | head -n 1)"
          bash scripts/floor_venv_run.sh /tmp/pqtools-floor-venv/bin/python "$FLOOR_LOG" "$PYTHON_BIN" \
            > /tmp/pqtools-floor-run.log 2>&1
          bash scripts/check_floor_freshness.sh > /tmp/pqtools-floor-fresh.log 2>&1
          tail -n 20 /tmp/pqtools-floor-run.log /tmp/pqtools-floor-fresh.log

      - name: Upload floor evidence and logs
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: floor-evidence-logs-${{ matrix.os }}-${{ matrix.python-version }}
          path: |
            evidence/floor-venv-suite-*.log
            /tmp/pqtools-floor-run.log
            /tmp/pqtools-floor-fresh.log
          if-no-files-found: error
