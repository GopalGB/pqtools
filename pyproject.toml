[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "pqtools"
version = "0.10.0"
description = "Run, lint and format Power Query M without Power BI. Executes a .pq query end to end on local CSV files in pure Python - like pandas for Power Query - plus a linter, formatter and safe rename for .pq and the queries inside .pbix/.xlsx"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Gopal Bagaswar" }]
keywords = [
    "power-query",
    "powerquery",
    "power-query-m",
    "m-language",
    "power-bi",
    "powerbi",
    "fabric",
    "mashup",
    "linter",
    "formatter",
    "static-analysis",
    "etl",
    "data-engineering",
    "csv",
    "excel",
    "pbix",
    "dataframe",
    "offline",
    "pq",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Compilers",
    "Topic :: Software Development :: Interpreters",
    "Topic :: Database",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Topic :: Utilities",
    "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
fabric = ["pyarrow>=14"]
# pqtools.export - to_pandas()/to_arrow()/to_parquet(). Optional so the
# CLI/linter half of this package never drags in a data-science stack;
# `arrow` covers both to_arrow() and to_parquet() since parquet support
# ships inside the pyarrow wheel itself, no separate package needed.
# BOTH ENDS of these ranges are exercised, not just the version that happens
# to be installed: the type map produces byte-identical dtypes on pandas
# 2.3.3 / pyarrow 14.0.2 and on pandas 3.0.5 / pyarrow 25.0.1, and the 63
# export tests pass on both. See
# evidence/export-dtypes-across-the-declared-range-2026-09-06.txt. Raising
# either floor needs a reason; widening one needs a fresh run.
pandas = ["pandas>=2"]
arrow = ["pyarrow>=14"]
# Connector drivers, kept optional the way pandas keeps psycopg and
# SQLAlchemy optional: nobody installing a linter should pull an ODBC stack.
excel = ["openpyxl>=3.1"]
sql = ["pyodbc>=5"]
postgres = ["psycopg[binary]>=3.1"]
mysql = ["pymysql>=1.1"]
oracle = ["oracledb>=2"]
all = [
    "pandas>=2",
    "pyarrow>=14",
    "openpyxl>=3.1",
    "pyodbc>=5",
    "psycopg[binary]>=3.1",
    "pymysql>=1.1",
    "oracledb>=2",
]
dev = [
    # pandas and pyarrow are optional for USERS but required for the gate:
    # without them every export test skips, and 34 silent skips reporting
    # green is the same failure release_gate.sh step 7 already guards
    # against by printing "THIS CHECK DID NOT RUN".
    "pandas>=2",
    "pyarrow>=14",
    "openpyxl>=3.1",
    # An independent (Rust) xlsx reader. The container write path is verified
    # by readers that share no code with ours or with each other; a second
    # Python parser would be a weaker check than a second implementation.
    "python-calamine>=0.2",
    "pytest>=8",
    "pytest-cov>=5",
    "pytest-xdist>=3",
    "mypy>=1.10",
    "ruff>=0.5",
    "build>=1.2",
    "twine>=6.1",
    "pip-audit>=2.7",
]

[project.urls]
Homepage = "https://github.com/GopalGB/pqtools"
Documentation = "https://github.com/GopalGB/pqtools#readme"
Changelog = "https://github.com/GopalGB/pqtools/releases"
Repository = "https://github.com/GopalGB/pqtools"
Issues = "https://github.com/GopalGB/pqtools/issues"

[project.scripts]
pq = "pqtools.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pqtools = ["_bridge.cjs", "THIRD_PARTY_NOTICES.txt", "py.typed"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
# `W` was added in round 52. A regex written as a non-raw string
# (`"\s+"`) is a Python DeprecationWarning today and a SyntaxError in a
# future release, and it shipped in a commit here: ruff was silent because
# W605 was not selected, and a `-W error` re-run missed it because the
# module was already compiled, so the compile-time warning did not re-emit.
# The whole repo is clean under `W`, so this costs nothing and closes the
# one path by which a warning can reach a commit unseen.
select = ["E", "F", "I", "UP", "B", "W"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]

# The optional driver extras ship no type stubs, and none exist on PyPI for
# most of them. Each is imported lazily inside the one connector that needs
# it, so an untyped import here costs nothing beyond that call boundary -
# whereas `strict = false` would cost the whole package its checking.
[[tool.mypy.overrides]]
module = [
    "openpyxl.*",
    "pyodbc.*",
    "psycopg2.*",
    "pymysql.*",
    "oracledb.*",
    "python_calamine.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["pqtools"]
