[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "pqtools"
version = "0.6.0"
description = "Run, lint and format Power Query M without Power BI. Executes a .pq query end to end on local CSV files in pure Python - like pandas for Power Query - plus a linter, formatter and safe rename for .pq and the queries inside .pbix/.xlsx"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Gopal Bagaswar" }]
keywords = [
    "power-query",
    "powerquery",
    "power-query-m",
    "m-language",
    "power-bi",
    "powerbi",
    "fabric",
    "mashup",
    "linter",
    "formatter",
    "static-analysis",
    "etl",
    "data-engineering",
    "csv",
    "excel",
    "pbix",
    "dataframe",
    "offline",
    "pq",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Compilers",
    "Topic :: Software Development :: Interpreters",
    "Topic :: Database",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Topic :: Utilities",
    "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
fabric = ["pyarrow>=14"]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "pytest-xdist>=3",
    "mypy>=1.10",
    "ruff>=0.5",
    "build>=1.2",
    "twine>=6.1",
    "pip-audit>=2.7",
]

[project.urls]
Homepage = "https://github.com/GopalGB/pqtools"
Documentation = "https://github.com/GopalGB/pqtools#readme"
Changelog = "https://github.com/GopalGB/pqtools/releases"
Repository = "https://github.com/GopalGB/pqtools"
Issues = "https://github.com/GopalGB/pqtools/issues"

[project.scripts]
pq = "pqtools.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pqtools = ["_bridge.cjs", "THIRD_PARTY_NOTICES.txt", "py.typed"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["pqtools"]
